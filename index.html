<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15120f">
    <title>Chess Arena</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main id="app">
        <canvas id="canvas" tabindex="0" aria-label="Interactive chess board" aria-describedby="rendererInfo"></canvas>
        <aside id="hud" aria-label="Game controls and status">
            <p class="eyebrow">Chess Arena</p>
            <h1>Tournament Board</h1>
            <div id="controls">
                <label>
                    View
                    <select id="rendererSelect" aria-label="Select board view">
                        <option value="3d">3D tournament view</option>
                        <option value="2d">2D board view</option>
                    </select>
                </label>
                <label>
                    Opponent
                    <select id="gameModeSelect" aria-label="Select game mode">
                        <option value="auto">Engine vs engine</option>
                        <option value="manual" selected>Play white vs classical</option>
                        <option value="manualBlack">Play black vs classical</option>
                        <option value="manualNNUEWhite">Play white vs NNUE</option>
                        <option value="manualNNUEBlack">Play black vs NNUE</option>
                    </select>
                </label>
                <button id="newGameBtn" type="button">New game</button>
            </div>
            <div id="statusPanel">
                <div id="sideDisplay" aria-live="polite">White: Human | Black: Classical</div>
                <div id="evalDisplay" aria-live="polite">Preparing board…</div>
                <div id="rendererInfo" aria-live="polite"></div>
            </div>
        </aside>
    </main>
    <script type="module" src="./app.js"></script>
</body>
</html>
