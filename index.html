<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Chess Engine</title>
    <style>
        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background: #111;
        }

        canvas {
            display: block;
            cursor: pointer;
        }

        #evalDisplay {
            color: white;
            font: 12px Arial, sans-serif;
            margin-top: 6px;
        }

        #sideDisplay {
            color: white;
            font: 12px Arial, sans-serif;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" aria-label="Chess board"></canvas>
    <div id="sideDisplay" aria-live="polite">White: Classical | Black: NNUE_Evaluator</div>
    <div id="evalDisplay" aria-live="polite">Classical eval: 0.00</div>
    <button id="newGameBtn" aria-label="Start a new game">Reset Game</button>
    <script type="module">
        import Game from "./game.js";
        import Renderer from "./renderer/2drenderer.js";
        import { BOARD_SIZE, SQUARE_SIZE } from "./ui-constants.js";

        const canvas = document.getElementById("canvas");
        const newGameBtn = document.getElementById("newGameBtn");
        const evalDisplay = document.getElementById("evalDisplay");
        const sideDisplay = document.getElementById("sideDisplay");
        const renderer = new Renderer(canvas);

        let game;

        function initializeGame() {
            if (game) {
                game.destroy();
            }

            game = new Game(renderer, 0, evalDisplay, sideDisplay);
            game.draw();
            game.startAutoPlay();
        }

        // Initialize game on load
        initializeGame();

        // Handle new game button
        newGameBtn.addEventListener("click", () => {
            initializeGame();
        });

        // Handle canvas clicks
        canvas.addEventListener("click", (event) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor(((event.clientX - rect.left) * scaleX) / SQUARE_SIZE);
            const y = Math.floor(((event.clientY - rect.top) * scaleY) / SQUARE_SIZE);

            if (x >= 0 && x < BOARD_SIZE && y >= 0 && y < BOARD_SIZE) {
                game.click(x, y);
            }
        });
    </script>
</body>
</html>
